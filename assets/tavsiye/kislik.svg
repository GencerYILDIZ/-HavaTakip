<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Bere ve atkı" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>Bere ve atkı</title>
<defs>
  <filter id="golge" x="-30%" y="-30%" width="160%" height="170%">
    <feDropShadow dx="0" dy="1.6" stdDeviation="1.3" flood-color="#1b2a40" flood-opacity=".3"/>
  </filter>
  <radialGradient id="gunes" cx=".38" cy=".34" r=".75">
    <stop offset="0" stop-color="#fff3a6"/><stop offset=".45" stop-color="#ffd43b"/><stop offset="1" stop-color="#f4a900"/>
  </radialGradient>
  <linearGradient id="damla" x1="0" y1="-4" x2="0" y2="4.4" gradientUnits="userSpaceOnUse">
    <stop offset="0" stop-color="#d3e1ee"/><stop offset="1" stop-color="#7f9bbb"/>
  </linearGradient><linearGradient id="bere" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ff6b6b"/><stop offset="1" stop-color="#d6303a"/></linearGradient><linearGradient id="atki" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4fb3a9"/><stop offset="1" stop-color="#2b7f77"/></linearGradient>
</defs>
<style>
  .salla{transform-box:view-box;transform-origin:32px 12px;animation:salla 3.2s ease-in-out infinite}
  .yuz{animation:yuz 2.6s ease-in-out infinite}
  .don{transform-box:fill-box;transform-origin:center;animation:don 12s linear infinite}
  .nabiz{transform-box:fill-box;transform-origin:center;animation:nabiz 2.4s ease-in-out infinite}
  .damla{animation:dus 1.2s linear infinite;opacity:0}
  .tane{animation:kar 2.6s linear infinite;opacity:0}
  .pirilti{transform-box:fill-box;transform-origin:center;animation:pirilti 2s ease-in-out infinite}
  .parla{animation:parla 2.4s ease-in-out infinite}
  .simsek{animation:simsek 2.2s steps(1) infinite}
  .esinti{stroke-dasharray:60 14;animation:esinti 2s linear infinite}
  .ucus{animation:ucus 2.8s ease-in-out infinite}
  .dalga{animation:dalga 2.4s ease-in-out infinite}
  @keyframes salla{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}
  @keyframes yuz{0%,100%{transform:translateY(0)}50%{transform:translateY(-2px)}}
  @keyframes don{to{transform:rotate(360deg)}}
  @keyframes nabiz{0%,100%{transform:scale(1)}50%{transform:scale(1.07)}}
  @keyframes dus{0%{transform:translateY(-4px);opacity:0}15%{opacity:1}85%{opacity:1}100%{transform:translateY(9px);opacity:0}}
  @keyframes kar{0%{transform:translate(0,-3px);opacity:0}15%{opacity:1}50%{transform:translate(2px,4px)}85%{opacity:1}100%{transform:translate(-1px,10px);opacity:0}}
  @keyframes pirilti{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.3;transform:scale(.6)}}
  @keyframes parla{0%,100%{transform:translateX(-14px);opacity:0}40%{opacity:.9}60%{opacity:.9}100%{transform:translateX(14px);opacity:0}}
  @keyframes simsek{0%,55%,63%,100%{opacity:1}58%,66%{opacity:.25}}
  @keyframes esinti{to{stroke-dashoffset:-74}}
  @keyframes ucus{0%{transform:translate(-6px,4px) rotate(0)}50%{transform:translate(6px,-3px) rotate(160deg)}100%{transform:translate(-6px,4px) rotate(360deg)}}
  @keyframes dalga{0%,100%{transform:translateX(-3px)}50%{transform:translateX(3px)}}
</style>
<circle class="tane" style="animation-delay:0.00s" cx="9" cy="12" r="1.8" fill="#fff" stroke="#c9d6e3" stroke-width=".5"/><circle class="tane" style="animation-delay:0.50s" cx="55" cy="16" r="2.0" fill="#fff" stroke="#c9d6e3" stroke-width=".5"/><circle class="tane" style="animation-delay:1.00s" cx="50" cy="40" r="1.6" fill="#fff" stroke="#c9d6e3" stroke-width=".5"/><circle class="tane" style="animation-delay:1.50s" cx="12" cy="44" r="1.8" fill="#fff" stroke="#c9d6e3" stroke-width=".5"/>
<g class="salla" filter="url(#golge)">
<path d="M17 30Q17 9 32 9Q47 9 47 30Z" fill="url(#bere)"/>
<g stroke="#ffffff" stroke-width="1.3" opacity=".35"><path d="M24 12V29M32 9V29M40 12V29"/></g>
<rect x="14" y="27" width="36" height="8" rx="4" fill="#b0252f"/>
<g stroke="#fff" stroke-width="1.4" opacity=".6"><path d="M18 31h28"/></g>
<circle cx="32" cy="8" r="5" fill="#ffffff" stroke="#dde5ee"/>
<path d="M14 41Q32 47 50 41L50 47Q32 53 14 47Z" fill="url(#atki)"/>
<path d="M40 46L44 60H37L35 47Z" fill="url(#atki)"/>
<g stroke="#ffffff" stroke-width="1.2" opacity=".7"><path d="M20 43.5L20 49M28 45L28 50.5M36 45L36 50.5M44 43.5L44 49M38 51h5M39 55h5"/></g>
</g>
</svg>
