<g fill="#7a4a1f"><circle cx="36.5" cy="34" r="1.4"/><circle cx="36.5" cy="41" r="1.4"/><circle cx="36.5" cy="48" r="1.4"/></g>
<g stroke="#8a5a2b" stroke-width="1" opacity=".5"><path d="M19 50h26M19 52h26"/><path d="M21 40h7v6h-7z" fill="none"/></g>
