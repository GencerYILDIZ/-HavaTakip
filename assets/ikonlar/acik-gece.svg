<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Açık gece" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>Açık gece</title>
<defs>
  <linearGradient id="bulutBeyaz" x1="0" y1="0" x2="0" y2="26" gradientUnits="userSpaceOnUse">
    <stop offset="0" stop-color="#ffffff"/><stop offset=".55" stop-color="#f1f4f8"/><stop offset="1" stop-color="#d4dbe5"/>
  </linearGradient>
  <linearGradient id="bulutGri" x1="0" y1="0" x2="0" y2="26" gradientUnits="userSpaceOnUse">
    <stop offset="0" stop-color="#d5dbe3"/><stop offset=".6" stop-color="#bcc4cf"/><stop offset="1" stop-color="#a3adba"/>
  </linearGradient>
  <linearGradient id="bulutKoyu" x1="0" y1="0" x2="0" y2="26" gradientUnits="userSpaceOnUse">
    <stop offset="0" stop-color="#a9b2bf"/><stop offset=".6" stop-color="#8b95a5"/><stop offset="1" stop-color="#727d8e"/>
  </linearGradient>
  <radialGradient id="gunes" cx=".38" cy=".34" r=".75">
    <stop offset="0" stop-color="#fff3a6"/><stop offset=".45" stop-color="#ffd43b"/><stop offset="1" stop-color="#f4a900"/>
  </radialGradient>
  <radialGradient id="gunesBatan" cx=".4" cy=".35" r=".8">
    <stop offset="0" stop-color="#ffd27a"/><stop offset=".5" stop-color="#ffaa3b"/><stop offset="1" stop-color="#ee7d1a"/>
  </radialGradient>
  <radialGradient id="ay" cx=".35" cy=".3" r=".85">
    <stop offset="0" stop-color="#fff2a0"/><stop offset=".5" stop-color="#ffd43b"/><stop offset="1" stop-color="#f2b200"/>
  </radialGradient>
  <linearGradient id="damla" x1="0" y1="-4" x2="0" y2="4.4" gradientUnits="userSpaceOnUse">
    <stop offset="0" stop-color="#d3e1ee"/><stop offset="1" stop-color="#8ea6c0"/>
  </linearGradient>
  <radialGradient id="kar" cx=".35" cy=".3" r=".8">
    <stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#d9e2ec"/>
  </radialGradient>
  <filter id="golge" x="-30%" y="-30%" width="160%" height="170%">
    <feDropShadow dx="0" dy="1.6" stdDeviation="1.3" flood-color="#1b2a40" flood-opacity=".28"/>
  </filter>
  <filter id="parilti" x="-60%" y="-60%" width="220%" height="220%">
    <feGaussianBlur stdDeviation="2.4"/>
  </filter><mask id="hilal1"><rect width="64" height="64" fill="#fff"/><circle cx="36" cy="25" r="16.34" fill="#000"/></mask>
</defs>
<style>
  .don{transform-box:fill-box;transform-origin:center;animation:don 18s linear infinite}
  .nabiz{transform-box:fill-box;transform-origin:center;animation:nabiz 3.2s ease-in-out infinite}
  .suz{animation:suz 5s ease-in-out infinite}
  .suzTers{animation:suz 6s ease-in-out infinite reverse}
  .yuz{animation:yuz 4.5s ease-in-out infinite}
  .damla{animation:dus 1.15s linear infinite;opacity:0}
  .hizli{animation-duration:.75s}
  .tane{animation:kar 2.8s linear infinite;opacity:0}
  .simsek{animation:simsek 2.6s steps(1) infinite}
  .pirilti{transform-box:fill-box;transform-origin:center;animation:pirilti 2.4s ease-in-out infinite}
  .serit{animation:serit 4s ease-in-out infinite}
  .serit2{animation:serit 4s ease-in-out infinite reverse}
  .esinti{stroke-dasharray:60 14;animation:esinti 2.2s linear infinite}
  .yuksel{animation:yuksel 4s ease-in-out infinite}
  .sallan{transform-box:fill-box;transform-origin:70% 60%;animation:sallan 5s ease-in-out infinite}
  .hale{transform-box:fill-box;transform-origin:center;animation:hale 4s ease-in-out infinite}
  @keyframes don{to{transform:rotate(360deg)}}
  @keyframes nabiz{0%,100%{transform:scale(1)}50%{transform:scale(1.05)}}
  @keyframes suz{0%,100%{transform:translateX(0)}50%{transform:translateX(2.6px)}}
  @keyframes yuz{0%,100%{transform:translateY(0)}50%{transform:translateY(-1.6px)}}
  @keyframes dus{0%{transform:translateY(-3px);opacity:0}15%{opacity:1}85%{opacity:1}100%{transform:translateY(8px);opacity:0}}
  @keyframes kar{0%{transform:translate(0,-2px);opacity:0}15%{opacity:1}50%{transform:translate(1.6px,4px)}85%{opacity:1}100%{transform:translate(-1px,8px);opacity:0}}
  @keyframes simsek{0%,62%,70%,100%{opacity:0}64%,74%{opacity:1}}
  @keyframes pirilti{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.35;transform:scale(.7)}}
  @keyframes serit{0%,100%{transform:translateX(-2.5px)}50%{transform:translateX(2.5px)}}
  @keyframes esinti{to{stroke-dashoffset:-74}}
  @keyframes yuksel{0%,100%{transform:translateY(1.5px)}50%{transform:translateY(-1.5px)}}
  @keyframes sallan{0%,100%{transform:rotate(-5deg)}50%{transform:rotate(5deg)}}
  @keyframes hale{0%,100%{opacity:.45;transform:scale(1)}50%{opacity:.8;transform:scale(1.06)}}
</style>
<g class="sallan"><circle cx="27" cy="32" r="19" fill="url(#ay)" mask="url(#hilal1)" filter="url(#golge)"/></g><polygon class="pirilti" style="animation-delay:0s" points="48.00,10.80 49.11,13.47 51.99,13.70 49.80,15.58 50.47,18.40 48.00,16.89 45.53,18.40 46.20,15.58 44.01,13.70 46.89,13.47" fill="url(#ay)" stroke="#f2b200" stroke-width=".5" stroke-linejoin="round"/><polygon class="pirilti" style="animation-delay:0.8s" points="55.00,24.80 55.85,26.84 58.04,27.01 56.37,28.44 56.88,30.59 55.00,29.44 53.12,30.59 53.63,28.44 51.96,27.01 54.15,26.84" fill="url(#ay)" stroke="#f2b200" stroke-width=".5" stroke-linejoin="round"/><polygon class="pirilti" style="animation-delay:1.5s" points="45.00,36.40 45.95,38.69 48.42,38.89 46.54,40.50 47.12,42.91 45.00,41.62 42.88,42.91 43.46,40.50 41.58,38.89 44.05,38.69" fill="url(#ay)" stroke="#f2b200" stroke-width=".5" stroke-linejoin="round"/>
</svg>
